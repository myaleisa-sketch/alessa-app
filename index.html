<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>مشاريع العيسى</title>
<link rel="manifest" href="manifest.json" id="mf">
<script>
  // آيفون: بلا manifest يحفظ Safari الرابط الحالي (ومعه رمز المنصة #k=) في أيقونة الشاشة الرئيسية،
  // فيفتح التطبيق المثبّت مباشرة دون طلب الرابط. أندرويد يبقى على manifest (ذاكرته مشتركة مع Chrome).
  if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))
    document.getElementById('mf').remove();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#EEF1F4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشاريع العيسى">
<style>
  html,body{margin:0;height:100%;background:#EEF1F4;font-family:Tahoma,sans-serif;color:#1B2733}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#EEF1F4;
         padding-top:env(safe-area-inset-top);box-sizing:border-box}
  .msg{display:none;position:fixed;inset:0;background:#EEF1F4;text-align:center;padding:48px 24px}
  .msg b{display:block;font-size:20px;margin-bottom:10px}
  .msg input{width:100%;max-width:420px;height:44px;margin-top:16px;padding:0 12px;border:1px solid #C9D0D8;border-radius:10px;font-size:14px;direction:ltr;box-sizing:border-box}
  .msg button{margin-top:14px;height:42px;padding:0 28px;border:0;border-radius:21px;background:#1F3A5F;color:#fff;font-size:15px}
  #err{color:#B23A2E;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<!-- رابط المنصة لا يُكتب في هذا الملف: يُحفظ في الجوال فقط عند أول فتح -->
<div id="setup" class="msg"><b>إعداد لمرة واحدة</b>الصق رابط المنصة الذي وصلك ثم اضغط «حفظ»
  <br><input id="lnk" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
  <div id="err"></div><button onclick="saveLink()">حفظ</button></div>
<div id="off" class="msg"><b>لا يوجد اتصال بالإنترنت</b>المنصة تحتاج اتصالًا لعرض الحسابات وتسجيل الحركات.<br><button onclick="location.reload()">إعادة المحاولة</button></div>
<script>
  const KEY = 'alessa_k';
  const store = { get(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } },
                  set(v){ try { localStorage.setItem(KEY, v); } catch(e){} } };
  // يقبل الرابط كاملًا أو المعرّف وحده، ويعيد المعرّف أو null
  function parseId(t){
    t = (t || '').trim();
    const m = t.match(/script\.google\.com\/macros\/s\/([\w-]{20,})\/exec/) || t.match(/^([\w-]{20,})$/);
    return m ? m[1] : null;
  }
  function start(id){
    document.getElementById('setup').style.display = 'none';
    const f = document.createElement('iframe');
    f.title = 'مشاريع العيسى'; f.allow = 'camera; clipboard-write';
    f.src = 'https://script.google.com/macros/s/' + id + '/exec';
    document.body.appendChild(f);
  }
  function saveLink(){
    const id = parseId(document.getElementById('lnk').value);
    if (!id) { document.getElementById('err').textContent = 'الرابط غير صحيح، انسخه كاملًا من الرسالة'; return; }
    store.set(id); keepInUrl(id); start(id);
  }
  // رابط الإعداد: .../#k=المعرّف — يضبط التطبيق في أي متصفح دون لصق، ويبقى في شريط العنوان عمدًا
  // حتى تحفظه أيقونة آيفون عند «إضافة إلى الشاشة الرئيسية»
  const h = location.hash.match(/^#k=(.+)$/);
  if (h && parseId(h[1])) store.set(parseId(h[1]));
  const id = store.get();
  if (id) { keepInUrl(id); start(id); } else document.getElementById('setup').style.display = 'block';
  // إن أُضيف الرابط بعد فتح الصفحة (بعض المتصفحات وتطبيقات المراسلة تفعل ذلك) يُلتقط ويُعاد التحميل
  addEventListener('hashchange', () => {
    const m = location.hash.match(/^#k=(.+)$/), v = m && parseId(m[1]);
    if (v && v !== store.get()) { store.set(v); location.reload(); }
  });
  function keepInUrl(v){ if (location.hash !== '#k=' + v) history.replaceState(null, '', location.pathname + '#k=' + v); }

  const off = document.getElementById('off');
  function chk(){ off.style.display = navigator.onLine ? 'none' : 'block'; }
  addEventListener('online', () => location.reload()); addEventListener('offline', chk); chk();
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
